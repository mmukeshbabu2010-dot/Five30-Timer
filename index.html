<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five30 Timer- 5:30 Interval Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }

    .timer-display {
      font-size: 5rem;
      font-weight: bold;
      font-family: monospace;
      color: #f8fafc;
      margin: 1rem 0;
    }

    .counter {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px 8px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .start-btn {
      background-color: #22c55e;
      color: #111827;
    }

    .start-btn:hover {
      background-color: #16a34a;
    }

    .pause-btn {
      background-color: #f59e0b;
      color: #111827;
    }

    .pause-btn:hover {
      background-color: #d97706;
    }

    .stop-btn {
      background-color: #ef4444;
      color: #ffffff;
    }

    .stop-btn:hover {
      background-color: #dc2626;
    }

    button:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .notif-status {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>QuadPace</h1>
    <p class="subtitle">Repeating 5:30 Interval Timer</p>
    
    <div class="timer-display" id="timeDisplay">05:30</div>
    <div class="counter" id="cycleCount">Rounds Completed: 0</div>
    
    <div class="buttons">
      <button class="start-btn" id="startBtn" onclick="startTimer()">Start</button>
      <button class="pause-btn" id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
      <button class="stop-btn" id="stopBtn" onclick="stopTimer()" disabled>Stop</button>
    </div>

    <div class="notif-status" id="notifStatus">Notifications: Checking...</div>
  </div>

  <script>
    const DURATION = 5 * 60 + 30; // 5 minutes 30 seconds (330 seconds)
    let timeLeft = DURATION;
    let timerInterval = null;
    let roundsCompleted = 0;
    let isPaused = false;

    const display = document.getElementById('timeDisplay');
    const cycleDisplay = document.getElementById('cycleCount');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const notifStatus = document.getElementById('notifStatus');

    // Request notification permissions on page load
    document.addEventListener('DOMContentLoaded', () => {
      if ('Notification' in window) {
        if (Notification.permission === 'granted') {
          notifStatus.textContent = "Notifications Enabled";
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              notifStatus.textContent = "Notifications Enabled";
            } else {
              notifStatus.textContent = "Notifications Denied";
            }
          });
        } else {
          notifStatus.textContent = "Notifications Denied";
        }
      } else {
        notifStatus.textContent = "Notifications Not Supported";
      }
    });

    // Sound alert setup
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
    }

    function triggerNotification() {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification("QuadPace Timer", {
          body: `Round ${roundsCompleted} completed! Starting next 5:30 block.`,
          icon: "https://fav.farm/⏱️"
        });
      }
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      display.textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function runTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          playBeep();
          roundsCompleted++;
          cycleDisplay.textContent = `Rounds Completed: ${roundsCompleted}`;
          triggerNotification();
          timeLeft = DURATION; // Reset to 5 minutes 30 seconds
          updateDisplay();
        }
      }, 1000);
    }

    function startTimer() {
      if (timerInterval) return;

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      isPaused = false;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      pauseBtn.textContent = "Pause";

      runTimer();
    }

    function togglePause() {
      if (isPaused) {
        // Resume timer
        isPaused = false;
        pauseBtn.textContent = "Pause";
        runTimer();
      } else {
        // Pause timer
        isPaused = true;
        clearInterval(timerInterval);
        timerInterval = null;
        pauseBtn.textContent = "Resume";
      }
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      isPaused = false;
      timeLeft = DURATION;
      updateDisplay();

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      pauseBtn.textContent = "Pause";
    }
  </script>
</body>
</html>
